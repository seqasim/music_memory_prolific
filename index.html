<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Memory Task (Online)</title>

    <!-- Prolific bot authenticity check. Study-specific; regenerate from Prolific if the study URL changes. -->
    <script src="https://assets.prolific.com/assets/js/integrity/guard.min.js?t=HXAo8zb0AgZ4c0epmygkk8vcUegG2GVcXOsUCE35gvYMeu-5uPo9ka9AmcWJ_V3x4abhLzeW5W7_pegGfqFfEWea-HzyCZ3JkywWT8-oJhoDxKlVc4THrjx4"></script>

    <!-- jsPsych 7 core + stylesheet -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" />

    <!-- jsPsych plugins used by this experiment -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-video-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-audio-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
    <script src="vendor/jspsych-7-pavlovia-2022.1.1.js"></script>

    <style>
      body {
        background: #ffffff;
        color: #111111;
      }
      #jspsych_target {
        height: 100vh;
      }
      .jspsych-content {
        max-width: 1000px;
        font-size: 24px;
      }
      .jspsych-btn {
        font-size: 22px;
        padding: 10px 20px;
      }
      .orient-choice {
        border: 4px solid transparent;
        padding: 14px 28px;
        border-radius: 8px;
        display: inline-block;
      }
      .orient-choice.selected {
        border-color: #111111;
        background: #f5f5f5;
      }
      .survey-timer-track {
        width: 520px;
        max-width: 90%;
        height: 8px;
        margin: 8px auto 0;
        background: #e6e6e6;
        border-radius: 4px;
        overflow: hidden;
      }
      .survey-timer-bar {
        height: 100%;
        width: 100%;
        background: #111111;
        animation-name: survey-timer-shrink;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }
      @keyframes survey-timer-shrink {
        from { width: 100%; }
        to { width: 0%; }
      }
      @media print {
        #consent-text {
          max-height: none !important;
          overflow: visible !important;
        }
      }
    </style>
  </head>
  <body>
    <!--
      Music Memory Task — Online jsPsych version
      ==========================================
      URL parameters (optional):
        ?participant=P01
        ?birthYear=1990
        ?phase=encoding|survey|recall   (debug: run one phase only)
        ?test=<passphrase>               (experimenter short test session; see config.js)

      Edit task settings in js/config.js
    -->
    <div id="jspsych_target"></div>

    <!-- Project scripts (order matters) -->
    <script src="js/config.js"></script>
    <script src="js/stimuli_manifest.js"></script>
    <script src="js/randomization.js"></script>
    <script src="js/datasaver.js"></script>
    <script src="js/common.js"></script>
    <script src="js/consent.js"></script>
    <script src="js/encoding.js"></script>
    <script src="js/survey.js"></script>
    <script src="js/recall.js"></script>
    <script src="js/experiment.js"></script>

    <script>
      const jsPsych = initJsPsych({
        display_element: 'jspsych_target',
        on_finish: function () {
          document.getElementById('jspsych_target').innerHTML +=
            '<p style="text-align:center;font-family:Arial;margin-top:24px;">Session ended.</p>';
        },
      });
      window.jsPsych = jsPsych;

      if (window.location.protocol === 'file:') {
        document.getElementById('jspsych_target').innerHTML =
          '<div style="max-width:700px;margin:40px auto;font-family:Arial,sans-serif;">' +
          '<h2>Cannot run from file://</h2>' +
          '<p>Open a terminal in <code>online_version/</code> and run:</p>' +
          '<pre style="background:#f4f4f4;padding:12px;">python3 -m http.server 8080</pre>' +
          '<p>Then visit <code>http://localhost:8080/index.html</code></p></div>';
      } else {
        runExperiment();
      }
    </script>
  </body>
</html>
